[tool.poetry]
name = "transcriber"
version = "0.1.0"
description = "Meeting transcription with Deepgram nova-3 (diarized)"
authors = ["zjor"]
package-mode = true
packages = [{ include = "deepgram_transcriber" }]

[tool.poetry.dependencies]
python = "^3.12"
deepgram-sdk = "^3.0"
python-dotenv = "^1.0"

[tool.poetry.scripts]
deepgram-transcribe = "deepgram_transcriber.cli:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
